<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>広告アンケート 集計</title>
<style>
  :root{--bg:#F1F7FB;--panel:#fff;--ink:#4A4446;--sub:#8A8385;--line:#DCE8F1;--navy:#26405F;--navy-soft:#EAF3FA;--pink:#BD7886;--pink-soft:#FBEEF1;--ok:#2E7D5B;--ok-soft:#E4F3EC;--warn:#A5602A;--warn-soft:#FBEDE2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Yu Gothic","YuGothic","Hiragino Sans",Meiryo,sans-serif;font-weight:500;font-size:14px;line-height:1.75}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:21px;font-weight:700;color:var(--navy);margin-bottom:4px}
  .sub{color:var(--sub);font-size:12.5px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  select{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
  .tabs{display:flex;gap:6px;margin:8px 0 16px;flex-wrap:wrap}
  .tab{font:inherit;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:var(--panel);color:var(--sub);padding:7px 14px;border-radius:999px;cursor:pointer}
  .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .view{display:none}.view.on{display:block}
  h2{font-size:16px;font-weight:700;color:var(--navy);margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--pink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}
  .twrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
  th{background:var(--navy-soft);text-align:left;font-size:12px;padding:8px 12px;white-space:nowrap;color:var(--navy)}
  td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
  td img{width:56px;border-radius:6px;display:block}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px}
  .t-good{background:var(--ok-soft);color:var(--ok)} .t-click{background:var(--warn-soft);color:var(--warn)} .t-weak{background:#eef0f2;color:#777}
  .barc{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
  .barc i{display:block;height:100%;background:var(--pink)}
  .gate{max-width:360px;margin:80px auto;text-align:center}
  .gate input{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;width:100%;margin:12px 0}
  .gate button{font:inherit;font-weight:700;padding:10px 18px;border:none;border-radius:999px;background:var(--pink);color:#fff;cursor:pointer}
  .qitem{border-top:1px solid var(--line);padding:10px 0}
  .qitem b{display:block;color:var(--navy)}
  .qitem .o{color:var(--sub);font-size:12.5px}
  .free{border-top:1px solid var(--line);padding:9px 0}
  .muted{color:var(--sub);font-size:12px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>広告アンケート 集計</h1>
  <input type="password" id="pw" placeholder="パスワード">
  <button id="go" type="button">開く</button>
  <p class="sub" id="gerr"></p>
</div>
<div class="wrap" id="main" hidden>

  <div class="bar"><span class="sub">絞り込み</span><select id="seg"></select></div>
  <div class="tabs">
    <button class="tab on" data-v="0" type="button">広告別の判定</button>
    <button class="tab" data-v="1" type="button">CTA・LP</button>
    <button class="tab" data-v="2" type="button">関わり別の声</button>
    <button class="tab" data-v="3" type="button">自由記述</button>
    <button class="tab" data-v="4" type="button">設問一覧</button>
  </div>
  <section class="view on" id="v0"></section>
  <section class="view" id="v1"></section>
  <section class="view" id="v2"></section>
  <section class="view" id="v3"></section>
  <section class="view" id="v4"></section>
</div>

function open(){
  if(document.getElementById("pw").value!==PW){document.getElementById("gerr").textContent="パスワードが違います";return;}
  document.getElementById("gate").hidden=true;document.getElementById("main").hidden=false;load();

document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){
  document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===t);});
  for(var i=0;i<5;i++)document.getElementById("v"+i).classList.toggle("on",String(i)===t.dataset.v);
});});
function pct(a,b){return b?Math.round(a/b*100):0;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function barc(p){return '<div class="barc"><i style="width:'+p+'%"></i></div>';}
function count(rows,key){var m={};rows.forEach(function(r){var v=r.answers[key];if(v==null||v==="")return;(Array.isArray(v)?v:[v]).forEach(function(x){m[x]=(m[x]||0)+1;});});return m;}
function table(title,m,n){
  var ks=Object.keys(m).sort(function(a,b){return m[b]-m[a];});
  var h='<h2>'+title+'</h2><div class="twrap"><table><tr><th>選択肢</th><th>人数</th><th>割合</th><th></th></tr>';
  if(!ks.length)h+='<tr><td colspan="4" class="muted">回答なし</td></tr>';
  ks.forEach(function(k){var p=pct(m[k],n);h+='<tr><td>'+esc(k)+'</td><td>'+m[k]+'</td><td>'+p+'%</td><td>'+barc(p)+'</td></tr>';});
  return h+'</table></div>';
}
function filt(){
  return ALL.filter(function(r){var rel=r.answers.rel,i=REL.indexOf(rel);
    if(SEG==="all")return true; if(SEG==="applied")return i>=0&&i<=2; if(SEG==="never")return i>=3; return "r"+i===SEG;});
}
function load(){
  fetch(U+"?member_id=eq.survey_abcash_banner&select=id,created_at,worry&order=id.asc",{headers:{apikey:K,Authorization:"Bearer "+K}})
   .then(function(r){return r.json();}).then(function(list){
    var seen={};
    list.forEach(function(x){try{var p=JSON.parse(x.worry);if(p.v!==2)return;if(p.answers&&/^TEST/.test(p.answers.banner_idea||""))return;seen[p.rid]=p;}catch(e){}});
    ALL=Object.keys(seen).map(function(k){return seen[k];});
    draw();
   }).catch(function(){document.getElementById("meta").textContent="読み込みに失敗しました";});
}
function draw(){
  var rows=filt();

  document.getElementById("meta").textContent="回答 "+ALL.length+"件（表示中 "+rows.length+"件）｜"+REL.map(function(r,i){return r.replace(/（.*?）/,"")+" "+byRel[i];}).join("・")+"｜"+new Date().toLocaleString("ja-JP")+" 時点";
  v0(rows);v1(rows);v2(rows);v3(rows);v4();
}
function v0(rows){
  var h='<div class="card"><b>見方</b>　表示＝その広告を見た人数（1人4点ずつ割り付け）／<b>クリック率</b>＝タップした人÷表示／<b>体験会転換</b>＝「予約まで進みたい」÷タップした人／<b>体験会到達</b>＝「予約まで進みたい」÷表示／<b>期待ズレ</b>＝タップ先を「動画だけ」「売られそう」と思った人÷表示。<br>判定：クリック率が中央値以上で体験会転換が中央値未満→<span class="tag t-click">クリック止まり</span>、どちらも中央値以上→<span class="tag t-good">体験会まで行く</span>。広告どうしの順位で見てください。</div>';
  var st=Object.keys(ADS).map(function(id){
    var n=0,tap=0,trial=0,gap=0,seen=0,best=0,bestT=0;
    rows.forEach(function(r){var a=r.answers["ad_"+id+"_react"];if(!a)return;n++;
      if(a===R[2]||a===R[3])tap++;if(a===R[3])trial++;
      var e=r.answers["ad_"+id+"_expect"];if(e==="無料動画がもらえるだけ"||e==="何かを売られそう")gap++;
      if(r.answers["ad_"+id+"_seen"]==="ある")seen++;
      if(r.answers.pick_tap===id)best++;if(r.answers.pick_trial===id)bestT++;});
    return {id:id,n:n,C:pct(tap,n),M:pct(trial,tap),F:pct(trial,n),G:pct(gap,n),seen:pct(seen,n),best:best,bestT:bestT};
  });
  function med(k){var a=st.filter(function(s){return s.n;}).map(function(s){return s[k];}).sort(function(x,y){return x-y;});return a.length?a[Math.floor(a.length/2)]:0;}
  var mC=med("C"),mM=med("M");
  st.sort(function(a,b){return b.F-a.F;});
  h+='<h2>広告別の判定（体験会到達の高い順）</h2><div class="twrap"><table><tr><th></th><th>広告</th><th>表示</th><th>クリック率</th><th>体験会転換</th><th>体験会到達</th><th>期待ズレ</th><th>見たことある</th><th>1つ選ぶなら</th><th>体験会まで行きそう</th><th>判定</th></tr>';
  st.forEach(function(s){
    var tag=!s.n?'<span class="tag t-weak">回答なし</span>':(s.C>=mC&&s.M>=mM?'<span class="tag t-good">体験会まで行く</span>':(s.C>=mC?'<span class="tag t-click">クリック止まり</span>':'<span class="tag t-weak">弱い</span>'));
    h+='<tr><td><img src="'+ADS[s.id].img+'" alt=""></td><td>'+ADS[s.id].name+'</td><td>'+s.n+'</td><td>'+s.C+'%</td><td>'+s.M+'%</td><td><b>'+s.F+'%</b></td><td>'+s.G+'%</td><td>'+s.seen+'%</td><td>'+s.best+'</td><td>'+s.bestT+'</td><td>'+tag+'</td></tr>';
  });
  h+='</table></div>'+table("選んだ理由（2つまで）",count(rows,"pick_why"),rows.length);
  document.getElementById("v0").innerHTML=h;
}

  var x={};rows.forEach(function(r){var a=r.answers.prior,b=r.answers.lp_head;if(!a||!b)return;x[a]=x[a]||{};x[a][b]=(x[a][b]||0)+1;});
  h+='<h2>これまでの学び方 × 私のことだと思った見出し</h2><div class="twrap"><table><tr><th>学び方</th><th>（a）一歩を踏み出せていない</th><th>（b）動画で学んでも</th><th>（c）スクールで変われず</th><th>どれも違う</th></tr>';
  Object.keys(x).forEach(function(a){h+='<tr><td>'+esc(a)+'</td>'+H.map(function(b){return '<td>'+(x[a][b]||0)+'</td>';}).join("")+'</tr>';});
  document.getElementById("v1").innerHTML=h+'</table></div>';
}

  var n=rows.length,h="";
  [["rel","ABCashとの関わり"],["concern","お金でいちばん気になっていること"],["prior","これまでの学び方"],["source","知ったきっかけ（申し込んだ人）"],["hesitate","申し込む前に迷ったこと"],["push","背中を押したもの"],["line_first","LINE登録後に届いたら進みやすかったもの"],["watched","動画・資料を体験会前に見たか"],["quit","体験会の前にやめようと思ったか"],["quit_reason","それでも参加した理由"],["noshow","体験会に行かなかった理由"],["why_not","申し込まなかった理由"],["age","年代"],["gender","性別"],["work","働き方"]].forEach(function(p){h+=table(p[1],count(rows,p[0]),n);});
