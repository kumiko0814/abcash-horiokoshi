<style>
  :root{--bg:#F1F7FB;--panel:#FFFFFF;--ink:#4A4446;--sub:#8A8385;--line:#DCE8F1;--navy:#26405F;--pink:#CF8F9C;--pink-d:#BD7886;--pink-soft:#FBEEF1;--blue:#7FB0D2;--blue-soft:#EAF3FA}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Yu Gothic","YuGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-weight:500;font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
  .bar .track{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--blue));transition:width .3s}
  .bar .lb{font-size:12px;color:var(--sub);margin-top:4px;text-align:right}
  h1{font-size:21px;font-weight:700;color:var(--navy);line-height:1.55;margin:10px 0 10px}
  .lead{font-size:15px;margin-bottom:12px}
  .note{font-size:13px;color:var(--sub)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;font-size:15px}
  .soft{background:var(--pink-soft);border:none;border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);margin:10px 0}
  .q{font-weight:700;font-size:16px;color:var(--navy);margin:20px 0 10px;line-height:1.6}
  .q small{display:block;font-weight:500;font-size:12.5px;color:var(--sub)}
  .q .req{display:inline-block;font-size:11px;background:var(--pink-d);color:#fff;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink)}
  .opt.sel{border-color:var(--pink-d);background:var(--pink-soft);font-weight:700}
  .opt:focus-visible,.thumb:focus-visible,.btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips .opt{width:auto;padding:8px 14px;font-size:14px;border-radius:999px}
  .ad{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .ad .sns{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:var(--sub)}
  .ad .sns i{width:26px;height:26px;border-radius:50%;background:var(--blue-soft);display:inline-block}
  .slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .slider img{flex:0 0 100%;width:100%;scroll-snap-align:center;display:block}
  .dots{display:flex;justify-content:center;gap:6px;padding:8px 0 4px}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .dots span.on{background:var(--pink-d)}
  .swipe{font-size:12px;color:var(--sub);text-align:center;padding:0 8px 10px}
  .thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .thumb{font:inherit;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;color:var(--ink);font-size:12.5px}
  .thumb img{width:100%;border-radius:8px;display:block;margin-bottom:4px}
  .thumb.sel{border-color:var(--pink-d);background:var(--pink-soft)}
  .thumb.none{grid-column:1/-1;padding:12px}
  .lp{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
  .lp .tt{font-size:13px;font-weight:700;color:var(--navy);padding:10px 12px 6px}
  .lp img{width:100%;display:block}
  .lp a{display:block;text-align:center;font-size:14px;font-weight:700;color:var(--navy);padding:10px;border-top:1px solid var(--line);text-decoration:none}
  .scrollbox{max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  .scrollbox img{width:100%;display:block}
  textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:120px;background:var(--panel);color:var(--ink)}
  .nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 72%,rgba(241,247,251,0));padding:14px 16px 20px}
  .nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;font:inherit;font-weight:700;font-size:16px;border:none;border-radius:999px;padding:14px;cursor:pointer}
  .btn.next{background:var(--pink-d);color:#fff}
  .btn.next:disabled{background:#e3c3ca;cursor:not-allowed}
  .btn.back{flex:0 0 88px;background:var(--panel);color:var(--sub);border:1.5px solid var(--line)}
  .err{color:var(--pink-d);font-size:13px;min-height:1em;margin-top:8px}
  .hl{background:linear-gradient(transparent 60%,var(--pink-soft) 60%)}
  .mini{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:18px}
  .mini img{width:104px;flex:0 0 104px;border-radius:8px;display:block}
  .mini .q{margin:0 0 8px}
  .mini .chips .opt{font-size:13px;padding:6px 11px}
  .hlbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
  .hlbox img{width:100%;display:block}
  .hlbox .cap{font-size:15px;font-weight:700;color:var(--navy);padding:10px 12px;border-top:1px solid var(--line)}
  .done{text-align:center;padding-top:40px}
  .bug{display:block;text-align:center;font-size:12px;color:var(--sub);margin-top:30px;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}
</style>
</head>

function aiQs(){return shown.map(function(id){return {k:"ai_"+id,t:"",type:"chips",o:AI_OPT};}).concat(AIQ2);}
function qHTML(q){
  if(q.show&&!q.show())return "";
  var h='<div class="q">'+txt(q.t)+(q.req?'<span class="req">必須</span>':'')+(q.note?'<small>'+q.note+'</small>':'')+'</div>';
  if(q.type==="text"){return h+'<textarea data-k="'+q.k+'" placeholder="'+(q.k==="banner_idea"?"例：〇〇な人が出てきて、〇〇がわかるなら申し込みたい":"")+'">'+(A[q.k]||"").replace(/</g,"&lt;")+'</textarea>';}
  var cls=q.type==="chips"?"chips":"opts";
  h+='<div class="'+cls+'">';
  opts(q).forEach(function(o){
    var sel=q.type==="multi"?(A[q.k]||[]).indexOf(o)>=0:A[q.k]===o;
    h+='<button type="button" class="opt'+(sel?' sel':'')+'" data-k="'+q.k+'" data-v="'+o+'">'+o+'</button>';
  });
  return h+'</div>';
}
function thumbsHTML(k,title){
  var h='<div class="q">'+title+'</div><div class="thumbs">';
  shown.forEach(function(id,i){h+='<button type="button" class="thumb'+(A[k]===id?' sel':'')+'" data-t="'+k+'" data-v="'+id+'"><img src="'+ADS[id].imgs[0]+'" alt="">'+(i+1)+'つ目の広告</button>';});
  return h+'<button type="button" class="thumb none'+(A[k]==="none"?' sel':'')+'" data-t="'+k+'" data-v="none">どれもない</button></div>';
}
function curQs(){
  var s=S[cur];
  if(s.kind==="ad")return adQs(s.id);
  if(s.kind==="pick")return [{k:"pick_why",type:"multi",max:2}];
  if(s.kind==="split")return [{k:"split_react",type:"one"}];
  if(s.kind==="lpheads")return [LPQ1];
  if(s.kind==="lpbody")return LPQ2;
  if(s.kind==="headline")return HLQ;
  if(s.kind==="ai")return aiQs();
  return s.qs||[];
}
function render(){
  var s=S[cur], h="";
  if(s.kind==="intro"){
    h='<h1>お金の広告についての<br>アンケートのお願い</h1>'
     +'<p class="lead">お金のスクール「ABCash」の広告とページを見て、感じたことを教えてください。ABCashを知らない方も大歓迎です。</p>'
     +'<div class="card">正解はありません。<br>'+HONEST+'<br><br>回答はお名前が分からない形で集計し、これからの広告づくりの参考にします。</div>'
     +(CFG.thanks?'<div class="soft">'+CFG.thanks+'</div>':'')
     +'<p class="note">所要時間 7分ほど・ほとんどタップで答えられます</p>';
  }else if(s.kind==="ad"){
    h='<h1>広告 '+s.n+' / '+shown.length+'</h1>'+(s.n===1?'<div class="soft">'+HONEST+'</div>':'')+adHTML(ADS[s.id].imgs)+adQs(s.id).map(qHTML).join("");
  }else if(s.kind==="pick"){
    h='<h1>今見た4つの広告を比べると</h1>'
     +thumbsHTML("pick_tap","<span class='hl'>"+you()+"</span>が1つだけ押すなら、どれ？")
     +thumbsHTML("pick_trial","押したあと、<span class='hl'>無料体験会の予約まで進みそう</span>なのはどれ？")
     +qHTML({k:"pick_why",t:"そう思った理由は？",note:"2つまで",o:["自分のことだと思えた","絵・写真の雰囲気が好き","続きが気になった","何がもらえるかわかりやすい","信頼できそう","押しつけ感がない","どれもピンとこない","その他"],type:"multi",max:2});
  }else if(s.kind==="split"){
    var src=group==="T"?"img/s_trial.jpg":"img/s_video.jpg";
    h='<h1>もう1枚だけ</h1>'+adHTML([src])
     +qHTML({k:"split_react",t:"<span class='hl'>"+you()+"</span>なら、この広告が流れてきたらどうしますか？",o:["スルーする","止まって見る（タップはしない）","ボタンを押す"],type:"one"});
  }else if(s.kind==="lpheads"){
    h='<h1>広告を押した先のページ</h1>'
     +'<p class="lead">広告を押すと、この3つのどれかのページが開きます。違うのは一番上の見出しだけです。</p>'
     +'<div class="soft">'+HONEST+'</div>'
     +[["a","（a）お金の勉強を始められていない方へ"],["b","（b）動画で学んでも変わらなかった方へ"],["c","（c）スクールで学んでも変わらなかった方へ"]].map(function(p){
        return '<div class="lp"><div class="tt">'+p[1]+'</div><img src="img/lp_'+p[0]+'_hero.jpg" alt=""><a href="'+LP[p[0]]+'" target="_blank" rel="noopener">実際のページを開く ↗</a></div>';}).join("")
     +qHTML(LPQ1);
  }else if(s.kind==="lpbody"){
    h='<h1>ページの中身を見てください</h1>'
     +'<p class="lead">見出しの下は3つとも同じ内容です。枠の中を<b>最後までスクロール</b>して読んでください。</p>'
     +'<div class="scrollbox"><img src="img/lp_full.jpg" alt="ページ全体"></div>'
     +'<p class="note" style="margin-top:8px">スマホで実際に見たい方は <a href="'+LP.a+'" target="_blank" rel="noopener">こちらから開けます ↗</a></p>'
     +LPQ2.map(qHTML).join("");
  }else if(s.kind==="headline"){
    h='<h1>この見出しについて</h1>'
     +'<p class="lead">最初のほうで見た、この広告の見出しについて教えてください。</p>'
     +'<div class="hlbox"><img src="img/b2.jpg" alt="広告画像"><div class="cap">「動画でお金を学んでも、何も変わらず、諦めたあなたへ。」</div></div>'
     +HLQ.map(qHTML).join("");
  }else if(s.kind==="ai"){
    h='<h1>画像の作られ方について</h1>'
     +'<p class="lead">今日見た4つの広告の画像は、どうやって作られたと思いますか？　当てるクイズではないので、感じたままで大丈夫です。</p>'
     +shown.map(function(id,i){
        var q={k:"ai_"+id,t:"",type:"chips",o:AI_OPT};
        return '<div class="mini"><img src="'+ADS[id].imgs[0]+'" alt=""><div><div class="q">'+(i+1)+'つ目の広告</div>'+qHTML(q).replace(/^<div class="q"><\/div>/,'')+'</div></div>';
      }).join("")
     +AIQ2.map(qHTML).join("");
  }else if(s.kind==="qs"){
    h='<h1>'+s.title+'</h1>'+s.qs.map(qHTML).join("");
  }else if(s.kind==="done"){
    h='<div class="done"><h1>ご協力ありがとうございました</h1><p class="lead">いただいた声は、これからの広告づくりに大切に使わせていただきます。</p>'+(CFG.thanks?'<div class="soft">'+CFG.thanks+'</div>':'')+'</div>';
  }
  app.innerHTML=h+'<div class="err" id="err"></div>';
  bind(); prog(); window.scrollTo(0,0);
}
function visible(i){var s=S[i];return !s.when||s.when();}
function total(){var n=0;for(var i=1;i<S.length-1;i++)if(visible(i))n++;return n;}
function pos(){var n=0;for(var i=1;i<=cur;i++)if(visible(i))n++;return n;}
function lastIdx(){for(var i=S.length-2;i>=0;i--)if(visible(i))return i;return 0;}
function prog(){
  var s=S[cur];
  document.getElementById("bar").hidden=(s.kind==="intro"||s.kind==="done");
  document.getElementById("nav").hidden=(s.kind==="done");
  document.getElementById("fill").style.width=Math.round(pos()/total()*100)+"%";
  document.getElementById("lbl").textContent=pos()+" / "+total();
  document.getElementById("back").style.display=cur===0?"none":"";
  document.getElementById("next").textContent=s.kind==="intro"?"はじめる":(cur===lastIdx()?"送信する":"次へ");
}
function findQ(k){var qs=curQs();for(var i=0;i<qs.length;i++)if(qs[i].k===k)return qs[i];return {type:"one"};}
function bind(){
  app.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click",function(){
      var k=b.dataset.k,v=b.dataset.v,q=findQ(k);
      if(q.type==="multi"){
        var arr=(A[k]||[]).slice(),i=arr.indexOf(v),excl=/^(迷わなかった|どれもない|特になし|どれもピンとこない|見分けがつかない|特にない)$/;
        if(i>=0)arr.splice(i,1);
        else if(excl.test(v))arr=[v];
        else{arr=arr.filter(function(x){return !excl.test(x);});if(arr.length>=q.max)arr.shift();arr.push(v);}
        A[k]=arr;
      }else A[k]=v;
      if(k==="quit"||k==="rel"){render();return;}
      b.parentNode.querySelectorAll(".opt").forEach(function(x){
        var sel=q.type==="multi"?(A[k]||[]).indexOf(x.dataset.v)>=0:A[k]===x.dataset.v;
        x.classList.toggle("sel",sel);
      });
    });
  });
  app.querySelectorAll(".thumb").forEach(function(b){
    b.addEventListener("click",function(){A[b.dataset.t]=b.dataset.v;app.querySelectorAll('.thumb[data-t="'+b.dataset.t+'"]').forEach(function(x){x.classList.toggle("sel",x===b);});});
  });
  app.querySelectorAll("textarea").forEach(function(t){t.addEventListener("input",function(){A[t.dataset.k]=t.value;});});
  app.querySelectorAll(".slider").forEach(function(sl){
    var dots=sl.parentNode.querySelectorAll(".dots span");
    if(!dots.length)return;
    sl.addEventListener("scroll",function(){var i=Math.round(sl.scrollLeft/sl.clientWidth);dots.forEach(function(d,j){d.classList.toggle("on",i===j);});});
  });
}
function missing(){
  var s=S[cur],m=[];
  curQs().forEach(function(q){
    if(q.optional)return;if(q.show&&!q.show())return;
    var v=A[q.k];
    if(q.type==="text"){if(!v||v.trim().length<(q.min||1))m.push(q.k);return;}
    if(!v||(Array.isArray(v)&&!v.length))m.push(q.k);
  });
  if(s.kind==="pick"){["pick_tap","pick_trial"].forEach(function(k){if(!A[k])m.push(k);});}
  return m;
}
function send(){
  var clean={};Object.keys(A).forEach(function(k){clean[k]=A[k];});
  var payload={v:3,rid:rid,block:block,group:group,shown:shown,ua:navigator.userAgent.slice(0,120),at:new Date().toISOString(),answers:clean};
  var body={member_id:CFG.memberId,member_name:"回答者",mood:"広告アンケート回答",worry:JSON.stringify(payload),want:location.href.slice(0,180)};
  return fetch(U,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});
}
document.getElementById("next").addEventListener("click",function(){
  var m=missing(),err=document.getElementById("err");
  if(m.length){err.textContent=m.indexOf("banner_idea")>=0?"ひとことでも大丈夫なので、ご記入ください（5文字以上）":"まだ選んでいない質問があります";return;}
  if(cur===lastIdx()){
    var btn=this;btn.disabled=true;btn.textContent="送信中…";
    send().then(function(r){if(!r.ok)throw 0;store("abs3_done","1");cur=S.length-1;render();})
      .catch(function(){btn.disabled=false;btn.textContent="送信する";err.textContent="送信できませんでした。電波の良い場所でもう一度押してください";});
    return;
  }
  do{cur++;}while(cur<S.length-1&&!visible(cur));
  render();
});
document.getElementById("back").addEventListener("click",function(){
  if(cur<=0)return;
  do{cur--;}while(cur>0&&!visible(cur));
  render();
});
document.getElementById("bugBtn").addEventListener("click",function(){
  var t=prompt("どこで、どう動かなかったか教えてください");
  if(!t)return;
  fetch(U,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"return=minimal"},
    body:JSON.stringify({member_id:"bug_abcash-banner-survey",member_name:"広告アンケート",mood:"バグ報告",worry:t,want:location.href.slice(0,180)+" ／ "+navigator.userAgent.slice(0,140)})})
   .then(function(){document.getElementById("bugBtn").textContent="送りました。ありがとうございます";});
});
render();
})();
</script>
